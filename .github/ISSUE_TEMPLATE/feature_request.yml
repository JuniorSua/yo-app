name: Feature request
description: An idea that would make Yo more useful.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or situation, in plain words. What's hard or impossible today?
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you imagine it working. Sketches and screenshots welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Examples from other apps, links, privacy or security considerations.
    validations:
      required: false
