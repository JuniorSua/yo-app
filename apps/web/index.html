<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#1C1D20" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Yo</title>
    <script>
      // Apply the last-used theme before first paint (no flash).
      (() => {
        let t = "dark";
        try {
          t = localStorage.getItem("yo.theme") || "dark";
        } catch (_e) {}
        if (t === "system") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.className = t;
        // Yo's character hue (light mode only), cached by App.tsx.
        try {
          const h = localStorage.getItem("yo.hue");
          if (t === "light" && (h === "sprout" || h === "pebble" || h === "mimi"))
            document.documentElement.setAttribute("data-hue", h);
        } catch (_e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
