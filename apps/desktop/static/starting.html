<!doctype html>
<!--
  Shown by the desktop app while it signs in, before Yo's own UI loads (see src/keychainWait.ts, #74).
  Main may be blocked on a macOS Keychain prompt while this is on screen, so the page is fully static and
  any delayed text is driven from here, never from main. ?keychain=now|later|off picks the explanation.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' file:; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <meta name="color-scheme" content="light dark" />
    <title>Yo</title>
    <style>
      :root {
        --bg: #faf9f6;
        --card: #ffffff;
        --border: #e6e5df;
        --fg: #222420;
        --muted: #686c64;
        --brand: #f5cc36;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1d20;
          --card: #24262a;
          --border: #2d2f33;
          --fg: #f1f0eb;
          --muted: #a09f9a;
          --brand: #ffd43b;
        }
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        -webkit-app-region: drag;
        user-select: none;
        cursor: default;
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        max-width: 420px;
        padding: 24px;
        text-align: center;
      }
      img {
        width: 56px;
        height: 56px;
      }
      #status {
        color: var(--muted);
      }
      #keychain {
        display: none;
        margin-top: 6px;
        padding: 14px 18px;
        border: 1px solid var(--border);
        border-radius: 16px;
        background: var(--card);
        text-align: left;
      }
      #keychain.on {
        display: block;
      }
      #keychain b {
        display: block;
        margin-bottom: 4px;
        font-weight: 600;
      }
      #keychain [hidden] {
        display: none;
      }
      #keychain p {
        margin: 0;
        color: var(--muted);
      }
      #keychain em {
        font-style: normal;
        font-weight: 600;
        color: var(--fg);
      }
    </style>
  </head>
  <body>
    <main>
      <img src="logo.svg" alt="" />
      <div id="status">Starting Yo…</div>
      <div id="keychain" role="status" aria-live="polite">
        <b id="keychain-title">Waiting for macOS Keychain…</b>
        <p id="keychain-line">
          macOS is asking whether Yo can use its saved login (Yo Safe Storage). Enter your Mac password and
          click <em>Always Allow</em>.
        </p>
      </div>
    </main>
    <script>
      (() => {
        const mode = new URLSearchParams(location.search).get("keychain");
        const box = document.getElementById("keychain");
        if (mode === "now") {
          box.classList.add("on");
        } else if (mode === "later") {
          // Not sure macOS will ask: say it softly, and only if starting takes a moment.
          document.getElementById("keychain-title").hidden = true;
          document.getElementById("keychain-line").innerHTML =
            "If macOS asks whether Yo can use its saved login (Yo Safe Storage), enter your Mac password and click <em>Always Allow</em>.";
          setTimeout(() => box.classList.add("on"), 1000);
        }
      })();
    </script>
  </body>
</html>
